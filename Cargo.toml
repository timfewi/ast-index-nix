[package]
name = "ast-index"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Lightweight AST code index and query service for local agent harnesses"
license = "MIT"

[[bin]]
name = "ast-index"
path = "src/main.rs"

[lib]
name = "ast_index"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
ignore = "0.4"
nix = { version = "0.29", default-features = false, features = ["fs"] }
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "=0.14.4"
thiserror = "2"
tree-sitter = "0.25"
tree-sitter-bash = "=0.25.1"
tree-sitter-go = "=0.25.0"
tree-sitter-lua = "=0.5.0"
tree-sitter-sequel = "=0.3.11"
tree-sitter-javascript = "0.23"
tree-sitter-nix = "0.3.0"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = "warn"

[profile.release]
overflow-checks = true
strip = true

[profile.dev]
debug = 0
incremental = false
